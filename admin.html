<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حياة | الإدارة</title>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/yusufaljamri313-commits/protofilio/5c597a2e56b2be26a2473e914c1db4bedb54297f/%D9%84%D9%88%D8%AC%D9%88%20%D8%AD%D9%8A%D8%A7%D8%A9.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Outfit:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2d3a1f;
            --bg: #f0f7f4;
            --white: #ffffff;
            --text: #2d3a1f;
            --accent: #5a6b4a;
            --danger: #e63946;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--primary);
            color: var(--white);
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
        }

        .sidebar-logo img {
            height: 60px;
            border-radius: 12px;
            background: var(--white);
            padding: 5px;
            margin-bottom: 30px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        .main-content {
            margin-right: 260px;
            flex-grow: 1;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .table-container {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid var(--bg);
        }

        .status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #dcfce7;
            color: #166534;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .btn-whatsapp {
            color: #25D366;
            text-decoration: none;
            font-size: 1.2rem;
            margin-left: 10px;
            transition: 0.3s;
        }

        .btn-whatsapp:hover {
            transform: scale(1.2);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-end;
        }

        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
            }

            .nav-link span {
                display: none;
            }

            .main-content {
                margin-right: 80px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><img
                src="https://raw.githubusercontent.com/yusufaljamri313-commits/protofilio/5c597a2e56b2be26a2473e914c1db4bedb54297f/%D9%84%D9%88%D8%AC%D9%88%20%D8%AD%D9%8A%D8%A7%D8%A9.png">
        </div>
        <nav><a href="#" class="nav-link active"><i class="fas fa-home"></i><span>لوحة التحكم</span></a><a
                href="index.html" class="nav-link"><i class="fas fa-external-link-alt"></i><span>عرض الموقع</span></a>
        </nav>
    </aside>
    <main class="main-content">
        <div class="header">
            <h1>إدارة الطلبات</h1><button onclick="clearAll()"
                style="background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer;">مسح
                الكل</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>العميل</th>
                        <th>الخدمة</th>
                        <th>التواصل</th>
                        <th>التاريخ</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="requestsTable"></tbody>
            </table>
            <p id="noData" style="text-align: center; padding: 20px; display: none;">لا توجد طلبات</p>
        </div>
    </main>
    <script>
        async function loadRequests() {
            try {
                const res = await fetch('/api/requests');
                const data = await res.json();
                const table = document.getElementById('requestsTable');
                const noData = document.getElementById('noData');
                table.innerHTML = '';
                if (data.length === 0) noData.style.display = 'block';
                else {
                    noData.style.display = 'none';
                    data.forEach(req => {
                        const message = encodeURIComponent(`عزيزي ${req.name}، تحية طيبة من Life Hub..\n\nيسعدنا اهتمامكم بخدمة: ${req.service}. لقد تم استلام طلبكم بنجاح عبر الموقع الإلكتروني.\n\nمن فضلك، نرجو تزويدنا بمزيد من التفاصيل حول المتطلبات الخاصة بكم لكي نتمكن من خدمتكم بشكل أفضل.\n\nشكراً لثقتكم بنا.`);
                        const whatsappLink = `https://wa.me/${req.phone.replace(/\D/g, '')}?text=${message}`;
                        table.innerHTML += `
                            <tr>
                                <td>${req.name}</td>
                                <td>${req.service}</td>
                                <td>${req.phone}</td>
                                <td>${req.date}</td>
                                <td>
                                    <div class="actions">
                                        <a href="${whatsappLink}" target="_blank" class="btn-whatsapp" title="تواصل عبر واتساب">
                                            <i class="fab fa-whatsapp"></i>
                                        </a>
                                        <button onclick="deleteReq(${req.id})" class="btn-delete" title="حذف">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>`;
                    });
                }
            } catch (e) { console.error(e); }
        }
        async function deleteReq(id) { if (confirm('حذف؟')) { await fetch('/api/requests/' + id, { method: 'DELETE' }); loadRequests(); } }
        async function clearAll() { if (confirm('مسح الكل؟')) { await fetch('/api/requests', { method: 'DELETE' }); loadRequests(); } }
        setInterval(loadRequests, 5000); loadRequests();
    </script>
</body>

</html>
